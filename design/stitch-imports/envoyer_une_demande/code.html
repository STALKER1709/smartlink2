<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        /* Prevent scroll on body when drawer is open */
        body.drawer-open { overflow: hidden; }
        
        /* Custom scrollbar for modern look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.outline-variant'); border-radius: theme('borderRadius.full'); }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.outline'); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased flex flex-col min-h-screen">
<!-- TopAppBar (Transactional - Hidden on this page intent) -->
<header class="bg-surface fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 border-b border-outline-variant transition-colors duration-200 ease-in-out md:hidden">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant" onclick="history.back()" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-primary">SmartLink</span>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Desktop Sidebar/Nav (Transactional intent - minimal or none, but keeping structure for layout) -->
<div class="flex flex-1 pt-14 md:pt-0 pb-safe md:pb-0">
<!-- Main Canvas -->
<main class="flex-1 max-w-container-max-width mx-auto w-full flex flex-col items-center p-margin-mobile md:p-margin-desktop gap-8">
<!-- Page Title -->
<div class="w-full max-w-2xl text-left">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2">Envoyer une demande</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Veuillez détailler votre besoin au prestataire.</p>
</div>
<!-- Content Area - Bento/Card Style -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden flex flex-col">
<!-- Reminder Card Section -->
<div class="p-gutter border-b border-outline-variant bg-surface flex items-start gap-4">
<img class="w-20 h-20 rounded-lg object-cover border border-outline-variant" data-alt="A professional plumber working under a modern sink, clear bright lighting, practical and trustworthy aesthetic, green tones reflecting the primary brand color, light mode, highly detailed." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDa8SZRkggmfzdJ6ILyOZ4kfcK-WJs8qIOLi33yjGXVlXuBrA1edySx5-rL_DYQPKpqhIvGBrZZyW-S_44Psxhh5tCORZ4BrrTXKPQ-R2H2NxY4bxKftCY__KDX3D5Ksx1QTFHH71GlGkUwINqMdz7gFgsWm2iKP-Zch-7rdFWW9_O9Z8oUvdzcsu1_vuFNhs703zD4sS4F5zDah4fSsBznawtPN1nUEHNPtGZWfC2gSxNufNbxV_uc"/>
<div class="flex-1 flex flex-col justify-center">
<h2 class="font-headline-md text-headline-md text-on-surface line-clamp-1">Dépannage plomberie 24h</h2>
<div class="flex items-center gap-1 text-on-surface-variant mt-1">
<span class="material-symbols-outlined text-[18px]">person</span>
<span class="font-body-md text-body-md">Jean Plomberie</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant mt-1">
<span class="material-symbols-outlined text-[18px]">location_on</span>
<span class="font-body-md text-body-md">Douala</span>
</div>
</div>
</div>
<!-- Form Section -->
<form class="p-gutter flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Need Description -->
<div class="flex flex-col gap-2">
<label class="font-body-md text-body-md text-on-surface" for="need_description">Décrivez votre besoin</label>
<textarea class="w-full rounded-lg border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface resize-none p-3 transition-colors placeholder:text-on-surface-variant/50" id="need_description" placeholder="Bonjour, j'ai une fuite sous l'évier depuis hier soir. Le débit est continu..." rows="5"></textarea>
</div>
<!-- Date Selection -->
<div class="flex flex-col gap-2">
<label class="font-body-md text-body-md text-on-surface flex justify-between items-center" for="preferred_date">
                            Date souhaitée <span class="text-on-surface-variant text-sm">(Facultatif)</span>
</label>
<div class="relative">
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface p-3 transition-colors cursor-pointer pl-10 appearance-none" id="preferred_date" type="date"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_month</span>
</div>
</div>
<!-- Trust Info Banner -->
<div class="bg-secondary-container rounded-lg p-4 flex gap-3 items-start border border-secondary/20">
<span class="material-symbols-outlined text-on-secondary-container mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-secondary-container">
                            SmartLink ne prélève rien sur la prestation. Le paiement se fait directement avec le prestataire après accord.
                        </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 mt-4">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-button-text text-button-text py-3 px-6 rounded-full transition-colors flex justify-center items-center gap-2 active:scale-95 duration-150" type="submit">
<span class="material-symbols-outlined">send</span>
                            Envoyer la demande
                        </button>
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low text-primary border border-primary font-button-text text-button-text py-3 px-6 rounded-full transition-colors flex justify-center items-center gap-2 active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined">save</span>
                            Enregistrer comme brouillon
                        </button>
</div>
</form>
</div>
</main>
</div>
<!-- BottomNavBar (Hidden due to transactional intent) -->
</body></html>
