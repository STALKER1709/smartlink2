<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ProxiServ - Publier un service</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#edeeeb",

                    "inverse-surface": "#2e312f",
                    "surface-container-high": "#e7e8e6",
                    "secondary-fixed-dim": "#93d4b3",
                    "background": "#f9faf7",
                    "outline": "#6f7a72",
                    "surface-tint": "#086c49",
                    "secondary-container": "#aff1cf",
                    "on-primary-container": "#9aefc3",
                    "on-tertiary": "#ffffff",
                    "on-error-container": "#93000a",
                    "tertiary-fixed-dim": "#ffb68e",
                    "tertiary-container": "#a04700",
                    "primary": "#005538",
                    "primary-container": "#0f6f4c",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#005236",
                    "on-surface-variant": "#3f4943",
                    "surface-bright": "#f9faf7",
                    "secondary-fixed": "#aff1cf",
                    "primary-fixed": "#9ff4c8",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#095138",
                    "tertiary": "#7b3500",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#002113",
                    "inverse-on-surface": "#f0f1ee",
                    "outline-variant": "#bec9c0",
                    "surface-variant": "#e2e3e0",
                    "on-background": "#191c1b",
                    "on-secondary": "#ffffff",
                    "on-secondary-container": "#317054",
                    "surface": "#f9faf7",
                    "secondary": "#2a694f",
                    "on-secondary-fixed": "#002114",
                    "on-tertiary-container": "#ffd4bf",
                    "surface-dim": "#d9dad7",
                    "surface-container-low": "#f3f4f1",
                    "error-container": "#ffdad6",
                    "on-surface": "#191c1b",
                    "on-tertiary-fixed": "#331200"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "container-max-width": "1200px",
                    "unit": "4px",
                    "gutter": "16px",
                    "margin-desktop": "32px"
            },
            "fontFamily": {
                    "label-numeric": ["JetBrains Mono"],
                    "body-md": ["\"Source Sans 3\""],
                    "button-text": ["\"Source Sans 3\""],
                    "headline-xl": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "body-lg": ["\"Source Sans 3\""]
            },
            "fontSize": {
                    "label-numeric": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "button-text": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-xl": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}]
            }
          }
        }
      }

<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600&display=swap');
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col antialiased">
<!-- Task-Focused Header (Suppresses Main Nav Shell) -->
<header class="bg-surface sticky top-0 z-40 border-b border-outline-variant flex items-center px-margin-mobile h-14 w-full justify-between">
<button class="text-on-surface-variant hover:bg-surface-container-low rounded-full p-2 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Nouvelle annonce</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow w-full max-w-[800px] mx-auto px-margin-mobile md:px-margin-desktop py-6">
<!-- AI Assistant Banner -->
<section class="bg-secondary-container rounded-xl p-gutter mb-8 border border-outline-variant/30">
<div class="flex items-start gap-3 mb-2">
<span class="material-symbols-outlined text-on-secondary-container mt-1" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<div>
<h2 class="font-headline-md text-headline-md text-on-secondary-container">Faire rédiger mon annonce</h2>
<p class="text-on-secondary-container/80 text-sm mt-1">Décrivez votre métier en quelques mots, notre assistant générera une description professionnelle et optimisée.</p>
</div>
</div>
<div class="mt-4">
<textarea class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg p-3 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-none" placeholder="ex: je repare les fuites d'eau, je débouche les canalisations et j'installe des équipements sanitaires..." rows="2"></textarea>
</div>
<div class="mt-4 flex justify-end">
<button class="bg-primary text-on-primary font-button-text text-button-text py-2 px-6 rounded-full hover:bg-primary-container active:scale-95 transition-all flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                    Proposer un texte
                </button>
</div>
</section>
<!-- Formular -->
<form class="space-y-8 pb-24">
<!-- Basic Info Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="col-span-1 md:col-span-2 flex flex-col gap-2">
<label class="font-button-text text-button-text text-on-surface" for="title">Titre du service</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg p-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-surface" id="title" placeholder="Ex: Plombier chauffagiste expérimenté" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-button-text text-button-text text-on-surface" for="category">Catégorie</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-lg p-3 appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-surface pr-10" id="category">
<option value="">Sélectionner une catégorie</option>
<option value="plomberie">Plomberie</option>
<option value="electricite">Électricité</option>
<option value="menage">Ménage</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-button-text text-button-text text-on-surface" for="price">Prix indicatif (FCFA)</label>
<div class="flex flex-col sm:flex-row gap-2">
<input class="flex-1 bg-surface border border-outline-variant rounded-lg p-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-surface font-label-numeric text-label-numeric" id="price" placeholder="5 000" type="number"/>
<div class="relative sm:w-1/3">
<select class="w-full bg-surface border border-outline-variant rounded-lg p-3 appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-surface pr-8" id="unit">
<option value="heure">/ heure</option>
<option value="forfait">Forfait</option>
<option value="m2">/ m²</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-3 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="font-button-text text-button-text text-on-surface" for="description">Description détaillée</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-surface resize-y" id="description" placeholder="Détaillez vos prestations, votre expérience, le matériel fourni..." rows="5"></textarea>
</div>
<!-- Location -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="flex flex-col gap-2">
<label class="font-button-text text-button-text text-on-surface" for="city">Ville</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-lg p-3 appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-surface pr-10" id="city">
<option value="douala">Douala</option>
<option value="yaounde">Yaoundé</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-button-text text-button-text text-on-surface" for="neighborhood">Quartier</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg p-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none text-on-surface" id="neighborhood" placeholder="Ex: Akwa, Bonanjo..." type="text"/>
</div>
</div>
<!-- Availability -->
<label class="flex items-center gap-3 p-4 bg-surface-container-low border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-high transition-colors">
<input class="w-5 h-5 text-primary bg-surface border-outline-variant rounded focus:ring-primary focus:ring-2 accent-primary" type="checkbox"/>
<div class="flex flex-col">
<span class="font-button-text text-button-text text-on-surface">Disponible en ce moment</span>
<span class="text-sm text-on-surface-variant">Activez pour apparaître en priorité pour les urgences.</span>
</div>
</label>
<!-- Photos -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-end">
<label class="font-button-text text-button-text text-on-surface">Photos de vos réalisations</label>
<span class="text-sm text-on-surface-variant">0/5 max</span>
</div>
<div class="grid grid-cols-3 md:grid-cols-5 gap-3">
<!-- Main slot -->
<div class="col-span-2 row-span-2 md:col-span-1 md:row-span-1 aspect-square bg-surface-container-high border-2 border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-highest hover:border-primary transition-all">
<span class="material-symbols-outlined text-outline text-3xl mb-1">add_photo_alternate</span>
<span class="text-sm text-outline-variant font-medium">Principale</span>
</div>
<!-- Other slots -->
<div class="aspect-square bg-surface border border-dashed border-outline-variant rounded-lg flex items-center justify-center cursor-pointer hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-outline-variant">add</span>
</div>
<div class="aspect-square bg-surface border border-dashed border-outline-variant rounded-lg flex items-center justify-center cursor-pointer hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-outline-variant">add</span>
</div>
<div class="aspect-square bg-surface border border-dashed border-outline-variant rounded-lg flex items-center justify-center cursor-pointer hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-outline-variant">add</span>
</div>
<div class="aspect-square bg-surface border border-dashed border-outline-variant rounded-lg flex items-center justify-center cursor-pointer hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-outline-variant">add</span>
</div>
</div>
</div>
</form>
</main>
<!-- Sticky Action Footer -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-4 md:px-margin-desktop z-50">
<div class="max-w-[800px] mx-auto flex justify-end gap-4">
<button class="bg-surface text-primary border border-outline-variant font-button-text text-button-text py-3 px-8 rounded-full hover:bg-surface-container-low transition-colors w-full sm:w-auto text-center">
                Annuler
            </button>
<button class="bg-primary text-on-primary font-button-text text-button-text py-3 px-10 rounded-full hover:bg-primary-container active:scale-95 transition-all w-full sm:w-auto text-center shadow-sm">
                Publier
            </button>
</div>
</div>
</body></html>
